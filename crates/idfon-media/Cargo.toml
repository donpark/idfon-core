[package]
name = "idfon-media"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Media plane: live-call sessions, MoQ video, the capture/render adapter seam, and connection health."

[features]
default = []
linux-vaapi = ["iroh-live/vaapi"]

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
iroh = "1.5"
# No "capture" feature: idfon is headless audio (file source + cpal), and
# capture drags rusty-capture -> pipewire -> libspa on Linux, which fails to
# compile against Ubuntu 22.04/24.04 headers (needs PipeWire 1.x). Re-add only
# if video capture is ever needed, and only on runners with pipewire >= 1.x.
# Capture also belongs to the caller, not the daemon (see docs/audio-media.md,
# "Capture ownership and lifecycle authority"): CLI mic/camera input goes in
# idfon-cli or a caller-linked source, never as a feature here.
# Current moq-video owns codec/backend selection. Idfon supplies frames and
# chooses renditions; the upstream encoder selects the available backend.
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "60a3fcfc0dd2416f640496a2787404552b45cdb3", default-features = false, features = ["media", "capture", "playback", "file"] }
moq-audio = { git = "https://github.com/moq-dev/moq", rev = "4a6f52248", default-features = false, features = ["capture", "playback"] }
moq-video = { git = "https://github.com/moq-dev/moq", rev = "4a6f52248" }
n0-future = "0.3.2"
# (A rustix pin once lived here for hick, pulled in by iroh-mdns-peer-lookup.
# The iroh-live fork now uses iroh-mdns-address-lookup, so that chain is gone.)
#
# Version pin, not a direct dependency: libc 0.2.191 narrows `in6_ifreq` to
# `target_os = "macos"`, which breaks netdev (netwatch <- iroh) on the iOS
# target (`pnpm ios build`). Hold the graph at 0.2.189; drop the pin when
# iroh ships netwatch 0.20 / netdev 0.47 (or netdev gets the fix in 0.46.x).
libc = "=0.2.189"
# fMP4/MKV/TS/FLV/H.264 import (video file demuxing) and the in-memory
# broadcast pair used to replay imported tracks. Versions must stay in lock
# with what iroh-live resolves to (see Cargo.lock).
moq-mux = { git = "https://github.com/moq-dev/moq", rev = "4a6f52248" }
idfon-core = { path = "../idfon-core" }
idfon-protocol = { path = "../idfon-protocol" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Opus redundancy-loss harness (tests/opus_redundancy.rs, docs/media-adaptation.md
# §D7): same codec moq-audio encodes with, plus the raw `decode_fec` surface
# moq-audio does not expose. opusic-sys = maintained libopus 1.6.1 bindings
# (bundled cc build; see the fork's moq-audio for why).
opusic-sys = { version = "0.7", features = ["dred"] }

# Hardware H.264 in the Rust pipeline: VideoToolbox (Apple) / VAAPI (Linux).
# Target-gated because the `vaapi` feature pulls `cros-codecs`
# unconditionally, which does not build on non-Linux.
[target.'cfg(target_os = "macos")'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "60a3fcfc0dd2416f640496a2787404552b45cdb3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "60a3fcfc0dd2416f640496a2787404552b45cdb3", default-features = false }
